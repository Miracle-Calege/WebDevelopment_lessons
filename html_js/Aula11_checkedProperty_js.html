<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="../CSS/Aula11_checkedProperty_js.css">

</head>
<body>
<input type="checkbox" id="check"> <!-- type="checkbox"cria um checkbox -->
<label for="check">Subscreva</label> <br><br><!-- for atributo especifica para que componente o for e, por isso o valor do for deve ser igual ao id do componente(no nosso caso do input)-->

<input type="radio" id="visa" name="cartao"><!-- type="radio"cria um radio button ,name=value cria uma especie de button group que faz com que os radio button so aceite um a ser selecionado-->
<label for="visa">Visa</label> <br>

<input type="radio" id="master" name="cartao">
<label for="master">MasterCard</label> <br>

<input type="radio" id="payPal" name="cartao">
<label for="payPal">PayPal</label> <br>

<button type="submit" id="submeter">Submeter</button>

<p id="sub"></p>
<p id="pag"></p>

<script src="../JavaScript/Aula11_checkedProperty.js"></script>
</body>
</html>
